# En microservice = API + database, bygget og kørt som én samlet enhed.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: voltedge
      MYSQL_USER: voltedge
      MYSQL_PASSWORD: voltedge
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uvoltedge", "-pvoltedge"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: voltedge
      DB_PASSWORD: voltedge
      DB_NAME: voltedge
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
